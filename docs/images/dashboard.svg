<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#f8f9fa"/>

  <!-- Header -->
  <rect width="1200" height="60" fill="url(#grad1)"/>
  <text x="600" y="38" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">
    Financial Analytics Dashboard
  </text>

  <!-- KPI Cards Row 1 -->
  <!-- Card 1: Gross Revenue -->
  <rect x="50" y="100" width="250" height="140" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="175" y="130" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Gross Revenue</text>
  <text x="175" y="165" font-family="Arial, sans-serif" font-size="32" fill="#333" text-anchor="middle" font-weight="bold">$12.5M</text>
  <text x="175" y="195" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="middle">↑ 5.2% vs Last Month</text>
  <line x1="60" y1="220" x2="290" y2="210" stroke="#10b981" stroke-width="2"/>

  <!-- Card 2: Net Revenue -->
  <rect x="330" y="100" width="250" height="140" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="455" y="130" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Net Revenue</text>
  <text x="455" y="165" font-family="Arial, sans-serif" font-size="32" fill="#333" text-anchor="middle" font-weight="bold">$10.2M</text>
  <text x="455" y="195" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="middle">↑ 4.8% vs Last Month</text>
  <line x1="340" y1="218" x2="570" y2="212" stroke="#10b981" stroke-width="2"/>

  <!-- Card 3: Collection Rate -->
  <rect x="610" y="100" width="250" height="140" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="735" y="130" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Collection Rate</text>
  <text x="735" y="165" font-family="Arial, sans-serif" font-size="32" fill="#333" text-anchor="middle" font-weight="bold">95.5%</text>
  <text x="735" y="195" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="middle">↑ 1.6% vs Last Month</text>
  <line x1="620" y1="216" x2="850" y2="214" stroke="#10b981" stroke-width="2"/>

  <!-- Card 4: Days in A/R -->
  <rect x="890" y="100" width="250" height="140" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="1015" y="130" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Days in A/R</text>
  <text x="1015" y="165" font-family="Arial, sans-serif" font-size="32" fill="#333" text-anchor="middle" font-weight="bold">42.3</text>
  <text x="1015" y="195" font-family="Arial, sans-serif" font-size="14" fill="#ef4444" text-anchor="middle">↓ 2.1 vs Last Month</text>
  <line x1="900" y1="218" x2="1130" y2="214" stroke="#ef4444" stroke-width="2"/>

  <!-- Chart Area -->
  <rect x="50" y="270" width="1100" height="280" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">Revenue Trend - Last 6 Months</text>

  <!-- Simple bar chart visualization -->
  <rect x="100" y="420" width="120" height="100" fill="#667eea" opacity="0.7"/>
  <rect x="250" y="400" width="120" height="120" fill="#667eea" opacity="0.7"/>
  <rect x="400" y="380" width="120" height="140" fill="#667eea" opacity="0.7"/>
  <rect x="550" y="360" width="120" height="160" fill="#667eea" opacity="0.7"/>
  <rect x="700" y="340" width="120" height="180" fill="#667eea" opacity="0.7"/>
  <rect x="850" y="320" width="120" height="200" fill="#667eea" opacity="0.8"/>

  <!-- Month labels -->
  <text x="160" y="545" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Jun</text>
  <text x="310" y="545" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Jul</text>
  <text x="460" y="545" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Aug</text>
  <text x="610" y="545" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Sep</text>
  <text x="760" y="545" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Oct</text>
  <text x="910" y="545" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Nov</text>

  <!-- Watermark -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle" opacity="0.6">
    Placeholder - Actual screenshots will be added when application is built
  </text>
</svg>
