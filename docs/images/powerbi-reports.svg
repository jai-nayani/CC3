<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#f8f9fa"/>

  <!-- Header -->
  <rect width="1200" height="60" fill="url(#grad4)"/>
  <text x="600" y="38" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">
    Mock Power BI Reports - Executive Analytics
  </text>

  <!-- Report Container -->
  <rect x="30" y="90" width="1140" height="480" fill="white" stroke="#e0e0e0" stroke-width="2" rx="8"/>

  <!-- Power BI Logo Area -->
  <rect x="50" y="110" width="200" height="40" fill="#f3f4f6" rx="4"/>
  <text x="150" y="135" font-family="Arial, sans-serif" font-size="16" fill="#f2c811" text-anchor="middle" font-weight="bold">
    ⚡ Power BI
  </text>

  <!-- Filter Panel -->
  <rect x="50" y="165" width="200" height="375" fill="#f9fafb" stroke="#e0e0e0" stroke-width="1" rx="6"/>
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    Filters
  </text>

  <!-- Date Range Filter -->
  <text x="65" y="220" font-family="Arial, sans-serif" font-size="12" fill="#666">Date Range:</text>
  <rect x="65" y="230" width="160" height="25" fill="white" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="75" y="248" font-family="Arial, sans-serif" font-size="11" fill="#333">Last 6 Months ▼</text>

  <!-- Facility Filter -->
  <text x="65" y="280" font-family="Arial, sans-serif" font-size="12" fill="#666">Facility:</text>
  <rect x="65" y="290" width="160" height="25" fill="white" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="75" y="308" font-family="Arial, sans-serif" font-size="11" fill="#333">All Facilities ▼</text>

  <!-- Payer Filter -->
  <text x="65" y="340" font-family="Arial, sans-serif" font-size="12" fill="#666">Payer Type:</text>
  <rect x="65" y="350" width="160" height="25" fill="white" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="75" y="368" font-family="Arial, sans-serif" font-size="11" fill="#333">All Payers ▼</text>

  <!-- Apply Button -->
  <rect x="65" y="400" width="160" height="35" fill="#667eea" rx="6"/>
  <text x="145" y="423" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">
    Apply Filters
  </text>

  <!-- Export Button -->
  <rect x="65" y="450" width="160" height="35" fill="#10b981" rx="6"/>
  <text x="145" y="473" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">
    📥 Export Report
  </text>

  <!-- Main Visualization Area -->
  <rect x="280" y="110" width="870" height="430" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="6"/>

  <!-- KPI Cards in Report -->
  <rect x="310" y="140" width="180" height="80" fill="#f3f4f6" rx="6"/>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Revenue YTD</text>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="24" fill="#333" text-anchor="middle" font-weight="bold">$62.5M</text>

  <rect x="520" y="140" width="180" height="80" fill="#f3f4f6" rx="6"/>
  <text x="610" y="165" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Claims Processed</text>
  <text x="610" y="195" font-family="Arial, sans-serif" font-size="24" fill="#333" text-anchor="middle" font-weight="bold">52,341</text>

  <rect x="730" y="140" width="180" height="80" fill="#f3f4f6" rx="6"/>
  <text x="820" y="165" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Denial Rate</text>
  <text x="820" y="195" font-family="Arial, sans-serif" font-size="24" fill="#10b981" text-anchor="middle" font-weight="bold">7.5%</text>

  <rect x="940" y="140" width="180" height="80" fill="#f3f4f6" rx="6"/>
  <text x="1030" y="165" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Avg Days to Pay</text>
  <text x="1030" y="195" font-family="Arial, sans-serif" font-size="24" fill="#333" text-anchor="middle" font-weight="bold">28.5</text>

  <!-- Chart: Revenue by Payer -->
  <rect x="310" y="250" width="400" height="260" fill="#f9fafb" stroke="#e0e0e0" stroke-width="1" rx="6"/>
  <text x="510" y="275" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    Revenue by Payer Type
  </text>

  <!-- Donut chart representation -->
  <circle cx="460" cy="385" r="70" fill="none" stroke="#3b82f6" stroke-width="30"/>
  <circle cx="460" cy="385" r="70" fill="none" stroke="#10b981" stroke-width="30" stroke-dasharray="130 310" transform="rotate(-90 460 385)"/>
  <circle cx="460" cy="385" r="70" fill="none" stroke="#f59e0b" stroke-width="30" stroke-dasharray="88 352" transform="rotate(60 460 385)"/>
  <circle cx="460" cy="385" r="70" fill="none" stroke="#ef4444" stroke-width="30" stroke-dasharray="44 396" transform="rotate(145 460 385)"/>

  <!-- Legend -->
  <rect x="560" y="310" width="12" height="12" fill="#3b82f6"/>
  <text x="577" y="320" font-family="Arial, sans-serif" font-size="11" fill="#333">Medicare (35%)</text>

  <rect x="560" y="335" width="12" height="12" fill="#10b981"/>
  <text x="577" y="345" font-family="Arial, sans-serif" font-size="11" fill="#333">Commercial (30%)</text>

  <rect x="560" y="360" width="12" height="12" fill="#f59e0b"/>
  <text x="577" y="370" font-family="Arial, sans-serif" font-size="11" fill="#333">Medicaid (20%)</text>

  <rect x="560" y="385" width="12" height="12" fill="#ef4444"/>
  <text x="577" y="395" font-family="Arial, sans-serif" font-size="11" fill="#333">Self-Pay (15%)</text>

  <!-- Chart: Facility Performance -->
  <rect x="740" y="250" width="380" height="260" fill="#f9fafb" stroke="#e0e0e0" stroke-width="1" rx="6"/>
  <text x="930" y="275" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    Facility Performance Comparison
  </text>

  <!-- Bar chart -->
  <rect x="770" y="430" width="100" height="50" fill="#667eea" opacity="0.8"/>
  <text x="820" y="465" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">GMC</text>

  <rect x="890" y="450" width="100" height="30" fill="#667eea" opacity="0.6"/>
  <text x="940" y="470" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">DTC</text>

  <rect x="1010" y="460" width="100" height="20" fill="#667eea" opacity="0.4"/>
  <text x="1060" y="475" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">RH</text>

  <!-- Axis -->
  <line x1="760" y1="480" x2="1120" y2="480" stroke="#666" stroke-width="1"/>

  <!-- Labels -->
  <text x="820" y="495" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">General<tspan x="820" dy="10">Medical</tspan></text>
  <text x="940" y="495" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Downtown<tspan x="940" dy="10">Clinic</tspan></text>
  <text x="1060" y="495" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Riverside<tspan x="1060" dy="10">Hospital</tspan></text>

  <!-- Watermark -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle" opacity="0.6">
    Placeholder - Mock Power BI visualization - Actual reports will be added when application is built
  </text>
</svg>
