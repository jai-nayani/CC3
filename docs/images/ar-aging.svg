<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#f8f9fa"/>

  <!-- Header -->
  <rect width="1200" height="60" fill="url(#grad3)"/>
  <text x="600" y="38" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">
    Accounts Receivable Aging Analysis
  </text>

  <!-- Summary Cards -->
  <rect x="50" y="100" width="280" height="100" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="190" y="125" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Total Outstanding</text>
  <text x="190" y="160" font-family="Arial, sans-serif" font-size="28" fill="#333" text-anchor="middle" font-weight="bold">$3,500,000</text>

  <rect x="360" y="100" width="280" height="100" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="500" y="125" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Days in A/R</text>
  <text x="500" y="160" font-family="Arial, sans-serif" font-size="28" fill="#333" text-anchor="middle" font-weight="bold">42.3</text>

  <rect x="670" y="100" width="480" height="100" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="910" y="125" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Collection Rate</text>
  <text x="910" y="160" font-family="Arial, sans-serif" font-size="28" fill="#10b981" text-anchor="middle" font-weight="bold">95.5%</text>
  <text x="910" y="185" font-family="Arial, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">↑ 1.6% vs Last Month</text>

  <!-- Aging Buckets - Pie Chart -->
  <rect x="50" y="230" width="550" height="320" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="325" y="260" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">
    A/R Aging Distribution
  </text>

  <!-- Pie chart (simplified as circles) -->
  <circle cx="250" cy="390" r="90" fill="#10b981" opacity="0.8"/>
  <circle cx="290" cy="370" r="90" fill="#3b82f6" opacity="0.7"/>
  <circle cx="330" cy="390" r="90" fill="#f59e0b" opacity="0.7"/>
  <circle cx="370" cy="400" r="90" fill="#ef4444" opacity="0.7"/>

  <!-- Legend -->
  <rect x="80" y="510" width="15" height="15" fill="#10b981"/>
  <text x="100" y="522" font-family="Arial, sans-serif" font-size="13" fill="#333">0-30 days: $2,100,000 (60%)</text>

  <rect x="290" y="510" width="15" height="15" fill="#3b82f6"/>
  <text x="310" y="522" font-family="Arial, sans-serif" font-size="13" fill="#333">31-60 days: $700,000 (20%)</text>

  <rect x="80" y="530" width="15" height="15" fill="#f59e0b"/>
  <text x="100" y="542" font-family="Arial, sans-serif" font-size="13" fill="#333">61-90 days: $350,000 (10%)</text>

  <rect x="290" y="530" width="15" height="15" fill="#ef4444"/>
  <text x="310" y="542" font-family="Arial, sans-serif" font-size="13" fill="#333">90+ days: $350,000 (10%)</text>

  <!-- Aging Table -->
  <rect x="630" y="230" width="520" height="320" fill="white" stroke="#e0e0e0" stroke-width="1" rx="8"/>
  <text x="890" y="260" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">
    Aging Details by Facility
  </text>

  <!-- Table Header -->
  <rect x="660" y="280" width="460" height="30" fill="#f3f4f6" rx="4"/>
  <text x="680" y="300" font-family="Arial, sans-serif" font-size="12" fill="#666" font-weight="bold">Facility</text>
  <text x="890" y="300" font-family="Arial, sans-serif" font-size="12" fill="#666" font-weight="bold">0-30</text>
  <text x="970" y="300" font-family="Arial, sans-serif" font-size="12" fill="#666" font-weight="bold">31-60</text>
  <text x="1050" y="300" font-family="Arial, sans-serif" font-size="12" fill="#666" font-weight="bold">60+</text>

  <!-- Table Rows -->
  <!-- Row 1 -->
  <text x="680" y="335" font-family="Arial, sans-serif" font-size="11" fill="#333">General Medical Center</text>
  <text x="890" y="335" font-family="Arial, sans-serif" font-size="11" fill="#333">$1.2M</text>
  <text x="970" y="335" font-family="Arial, sans-serif" font-size="11" fill="#333">$400K</text>
  <text x="1050" y="335" font-family="Arial, sans-serif" font-size="11" fill="#333">$200K</text>

  <!-- Row 2 -->
  <rect x="660" y="345" width="460" height="30" fill="#f9fafb" rx="4"/>
  <text x="680" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">Downtown Clinic</text>
  <text x="890" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">$600K</text>
  <text x="970" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">$200K</text>
  <text x="1050" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">$100K</text>

  <!-- Row 3 -->
  <text x="680" y="395" font-family="Arial, sans-serif" font-size="11" fill="#333">Riverside Hospital</text>
  <text x="890" y="395" font-family="Arial, sans-serif" font-size="11" fill="#333">$300K</text>
  <text x="970" y="395" font-family="Arial, sans-serif" font-size="11" fill="#333">$100K</text>
  <text x="1050" y="395" font-family="Arial, sans-serif" font-size="11" fill="#333">$50K</text>

  <!-- Totals Row -->
  <rect x="660" y="410" width="460" height="30" fill="#e5e7eb" rx="4"/>
  <text x="680" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333" font-weight="bold">Total</text>
  <text x="890" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333" font-weight="bold">$2.1M</text>
  <text x="970" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333" font-weight="bold">$700K</text>
  <text x="1050" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333" font-weight="bold">$350K</text>

  <!-- Action Items -->
  <text x="890" y="470" font-family="Arial, sans-serif" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">
    ⚠️ 350K in 90+ days bucket requires follow-up
  </text>

  <rect x="680" y="490" width="200" height="35" fill="#667eea" rx="6"/>
  <text x="780" y="513" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">
    View Detailed Report
  </text>

  <!-- Watermark -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle" opacity="0.6">
    Placeholder - Actual screenshots will be added when application is built
  </text>
</svg>
